[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-recorder"
version = "0.1.0"
description = "Gravador de macro estilo Excel em Python — grava cliques, teclas e scroll e reexecuta por âncora visual (locateOnScreen)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felipe Moreira" }]
dependencies = [
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# confidence em locateOnScreen (opcional — sem opencv cai para match exato)
ocr = [
    "opencv-python>=4.8",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mrec = "macro_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
